# Eval 3 — condition: all-v3
# second_finding + duplicate_insight (dedupe) + dissent_at_intake, plus v3 items (a) critic_citation and (c) duplicate_receipt.
# Generated from synth/synth.yaml at tag v2.1-eval (commit 3675228). Everything below the
# banner is that file verbatim; the condition's delta is stated above and applied at the end.
# ---------------------------------------------------------------------------------------
# Motif configuration
# Model roles and critic rules live here so they can be tuned without code changes.

models:
  intake: claude-haiku-4-5-20251001
  synthesis: claude-sonnet-5
  critic: claude-sonnet-5

loop:
  max_iterations: 3

synthesis:
  min_insights: 8
  max_insights: 14
  max_tokens: 64000      # includes thinking AND receipt quotes; 32K was hit twice in the first eval

# Critic rules. Each rule has an id, a plain-language description the critic
# reads, and a severity. "fail" rules block a pass; "warn" rules are reported
# but do not block. Deterministic rules are checked in code before the model
# is called; the rest are judged by the critic model against the transcripts.
critic:
  max_tokens: 32000      # the critic reads the whole corpus and thinks at length before answering
  rules:
    - id: unsupported
      severity: fail
      check: model
      description: >
        The cited turns do not actually support the claim as stated. The claim
        goes beyond what the participants said, paraphrases them inaccurately,
        or the cited turns are about something else.

    - id: single_source_generalisation
      severity: fail
      check: deterministic
      description: >
        The claim is stated as a general pattern but rests on evidence from
        only one participant, and confidence is marked medium or high. A
        single-source insight must be marked low confidence and must name the
        participant and their context in the claim.

    - id: missing_counterexample
      severity: fail
      check: model
      description: >
        The corpus contains a participant who clearly disagrees with, complicates,
        or reframes the claim, and the insight does not surface this as
        counter-evidence. Look actively for dissent; absence of counter-evidence
        should be rare and must be earned. Check especially the participant whose
        sector, career stage, or method differs from the rest (see profiles) —
        their dissent is the easiest to overlook and the most valuable to surface.

    - id: missing_theme
      severity: fail
      check: model
      description: >
        A topic that appears in the intake topic maps of THREE OR MORE transcripts
        has no insight covering it. Report it with insight_id "*", name the topic,
        and list one turn per transcript where it appears, so the synthesis agent
        can add the insight. This rule checks the corpus, not the page: the
        synthesis must not lose findings in revision.

    - id: silent_deletion
      severity: fail
      check: deterministic
      description: >
        An insight present before revision is absent after it and was not listed
        under "dropped" with a reason. Objections are fixed or downgraded, not
        deleted.

    - id: confidence_threshold
      severity: fail
      check: deterministic
      high_min_sources: 4
      medium_min_sources: 2
      high_forbids_counter: true
      description: >
        Confidence is defined numerically so the synthesis and critic agree on it:
        high = 4+ participants and no counter-evidence; medium = 2-3 participants,
        or 4+ with counter-evidence; low = 1 participant. Checked in code.

    - id: overconfident
      severity: fail
      check: model
      description: >
        Beyond the numeric threshold: the cited turns are weak, hedged, or
        tangential, so even the numerically permitted confidence overstates
        what the participants actually said.

    - id: vague_opportunity
      severity: warn
      check: model
      description: >
        The opportunity statement is generic ("improve guidance", "raise awareness")
        rather than specific enough that a designer could act on it.

    - id: merged_insights
      severity: warn
      check: model
      description: >
        Two distinct findings have been collapsed into one insight, losing a
        dimension (for example, epistemic loss of context and the labour cost
        of anonymisation are different findings).

    - id: quote_mismatch
      severity: fail
      check: deterministic
      description: >
        A citation's receipt (the verbatim quote) does not appear in the cited
        turn. The model cited a turn without reading it, or paraphrased instead
        of quoting. Every citation must carry a matching receipt.

    - id: interviewer_cited
      severity: fail
      check: deterministic
      description: >
        A cited evidence turn belongs to the interviewer (Researcher), not a
        participant. The interviewer's summaries and prompts are not evidence
        of what the participant thinks.

    - id: bad_citation
      severity: fail
      check: deterministic
      description: >
        A cited turn ID does not exist in the corpus, or an insight has no
        evidence at all. (The sources list is derived in code from the
        evidence, so it is never checked — nothing to get wrong.)

    # ---- v3 changes under test (Eval 3, condition all-v3) ----

    - id: second_finding
      severity: warn
      check: model
      description: >
        A turn already cited by some insight contains a SECOND, distinct finding that no insight
        uses. Eval 2 found the model extracts one finding per turn and stops: T-11 (deletion as
        waste, david:0022) and T-15 (method hierarchy, penni:0031) were absent from all six reports
        while both turns were cited in all six. Work through the CITED TURNS list: for each, ask
        what else this turn says that the synthesis has not used. Report with insight_id "*", name
        the finding in the detail, and give the turn. Only report a finding that could stand as its
        own insight, not a rephrasing of the insight that already cites the turn.

    - id: duplicate_insight
      severity: warn
      check: deterministic
      similarity_threshold: 0.55
      description: >
        Two insights state the same finding in different words. Checked in code by vocabulary
        overlap on title and claim; the reviser must merge them or sharpen each so they state
        different findings. Adding insights under pressure from missing_theme can over-split
        (Eval 2, R4: I-03/I-06 and I-15/I-16).

    - id: duplicate_receipt
      severity: warn
      check: deterministic
      description: >
        The same turn is cited more than once in one insight's evidence (or counter-evidence),
        inflating the receipt count without adding evidence. Checked in code. Warn, not fail: the
        claim is still supported, so this is padding to remove, not a claim to rewrite.

    - id: critic_citation
      severity: warn
      check: deterministic
      description: >
        The critic's own objections cite turns that are not usable evidence: a turn that does not
        exist, or an interviewer turn. Checked in code after the verdict is produced; the turns are
        removed from the objection before revision so the reviser is never sent to them, and the
        strip is reported here.

features:
  # Intake asks each participant's minority positions directly, and the critic receives that list as
  # its shortlist for missing_counterexample. Eval 2: Penni's pro-validation view was missed in 5 of 6
  # reports even with profiles.
  dissent_at_intake: true
  report_unevaluated_sections: false
