# Fly.io app for the Motif hosted engine. Deploy from the repository root:
#   fly deploy -c surfaces/hosted/fly.toml
# One shared-CPU machine kept running (a job in flight must not be stopped), one volume for
# redacted run logs. Secrets (set with `fly secrets set`): none for the BYOK tier; the paid
# tier adds ANTHROPIC_API_KEY and MOTIF_PAID_ENABLED=1 when it is switched on.

app = "motif-hosted"
primary_region = "ord"

[build]
  dockerfile = "surfaces/hosted/Dockerfile"

[env]
  MOTIF_RUNS_DIR = "/data/runs"
  MOTIF_WORK_DIR = "/tmp/motif"
  MOTIF_JOB_TTL = "3600"
  MOTIF_IP_CONCURRENT = "2"
  MOTIF_IP_DAILY = "20"
  MOTIF_MAX_FILE_MB = "12"
  MOTIF_MAX_JOB_MB = "64"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/healthz"

[mounts]
  source = "motif_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
