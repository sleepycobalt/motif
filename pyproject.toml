[project]
name = "synth-loop"
version = "0.2.0"
description = "An agentic loop that turns interview transcripts into a cited, critic-checked research synthesis."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "python-dotenv", "pyyaml", "python-docx"]

[project.scripts]
synth-loop = "synth.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "synth"]
