[project]
name = "etot-motif"
version = "0.2.0"
description = "Motif: an agentic loop that turns interview transcripts into a cited, critic-checked research synthesis."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "python-dotenv", "pyyaml", "python-docx"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest"]

[project.scripts]
motif = "synth.cli:main"
motif-mcp = "surfaces.mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "synth", "surfaces", "surfaces.mcp"]
